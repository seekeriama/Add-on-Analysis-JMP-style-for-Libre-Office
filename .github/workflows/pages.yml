# Hosts the Excel task pane (web/dist/excel) on GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy Excel task pane

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
          cp ../excel-addin/manifest.xml dist/excel/manifest.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/excel
      - id: deployment
        uses: actions/deploy-pages@v4
