[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellstat"
version = "0.1.0.dev0"
description = "Statistical analysis engine for spreadsheet add-ins (Excel and LibreOffice Calc)"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
tree = ["scikit-learn>=1.3"]
test = ["pytest", "scikit-learn>=1.3", "statsmodels>=0.14"]

[tool.setuptools]
packages = ["cellstat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
